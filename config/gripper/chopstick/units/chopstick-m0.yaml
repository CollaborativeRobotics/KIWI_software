schema: chopstick_unit_v1
description: >-
  Chopstick gripper, chopstick design, physical build m0 with ArUco marker ID 0
  (printed from KIWI_hardware), riding on camera insta360-X5-m0.
tool: chopstick

build:
  # This build's physical ArUco tag: ID 0, black-square edge 14 mm.
  marker:
    id: 0
    size: 0.014
  # Fixed camera<->marker pose: kiwi eef calibrate, 2026-10-21, on VID_20261021_160409_00_008.insv.
  # Solved through insta360-X5-m0's BORROWED intrinsics (insta360-X5-002's);
  # re-run with --force once that camera has its own lens calibration.
  fixed_pose:
    rvec:
    - 1.8127494750183035
    - -0.019529818670907948
    - 0.008503812965459762
    tvec:
    - 0.0007003398559292824
    - 0.04254478982710518
    - 0.03561886320281111
    fov_deg: 160.0
    out_size:
    - 1920
    - 1920
    lens: front

# Per-unit overrides over the tool's session: defaults. Omit to inherit.
# Our arms printed the jaw dots pale salmon, not the design's red: on the Lab
# a* channel they sit at 134-144 (below the red threshold 150, and below the
# orange fingertips), so detect them as light-on-dark instead. They also come
# out smaller in the plane warp (~110-190 px^2) than the design's min_area 145.
# Swept on data/scene/first (2026-10-22), 20 s per wrist.
session:
  polarity: light
  threshold: 90
  min_area: 60
  max_area: 400
  # This build's jaw lines sum to a steady +2.4 deg (m1: +0.85), i.e. the tag
  # sits ~1.2 deg rotated off the jaws' symmetry axis. The open angle (angle
  # between the lines) is independent of that; only the |l+r| gate is not.
  max_asymmetry_deg: 4.0
